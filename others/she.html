<!DOCTYPE html>
<html>

<head>
    <title>郑梓晨</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" type="text/css" href="..\styles\students.css">
    <link rel="stylesheet" type="text/css" href="..\styles\romantic.css">
    <link rel="icon" href="https://cdn.gh-proxy.org/https://github.com/fanghuangxu/62/raw/refs/heads/main/icons/icon/love.png" type="image/png">
</head>

<body>
    <div class="student-profile" style="width: 500px; height: 600px;">
        <h1>郑梓晨</h1>
        <img src="https://cdn.gh-proxy.org/https://github.com/fanghuangxu/62/raw/refs/heads/main/icons/others/she/zzc.png" alt="head image"
            style="width: 200px; height: 200px; object-fit: cover;">
        <p>名字: 郑梓晨</p>
        <p>班级: <a href="61.html">六（1）</a></p>
        <div class="contact">
            <code id="random-text"></code>
        </div>
    </div>
    <script>
        const messages = [
            "你是我心中最特别的人。<br>每次看到你，我都忍不住微笑。<br>希望有一天能和你一起走过校园的每一个角落。<br>你的笑容像阳光一样温暖我的心。<br>我默默喜欢着你，愿你能感受到这份心意。",
            "郑驿留宾处，看花又一年。<br>梓潼江口涪江上，深僻还如樗杜村。<br>晨兴登视云霁平，揽衣出门聊意行。",
            "春风拂面笑，<br>花影映窗遥。<br>心随君影动，<br>默默念如潮。",
            "谢谢你",
            "郑女嫣然笑，<br>梓树映清眸。<br>晨曦初照面，<br>美景不胜收。",
            "相思明月夜，<br>梦里见伊人。<br>一笑倾人城，<br>再笑倾人国。",
            "桃花朵朵开，<br>春风送香来。<br>与君初相见，<br>心动已难裁。",
            "云想衣裳花想容，<br>春风拂槛露华浓。<br>若非群玉山头见，<br>会向瑶台月下逢。",
            "春蚕到死丝方尽，<br>蜡炬成灰泪始干。<br>身无彩凤双飞翼，<br>心有灵犀一点通。",
            "衣带渐宽终不悔，<br>为伊消得人憔悴。<br>众里寻他千百度，<br>蓦然回首灯火阑珊处。",
            "蒹葭苍苍，白露为霜。<br>所谓伊人，在水一方。<br>溯洄从之，道阻且长。<br>溯游从之，宛在水中央。",
            "青青子衿，悠悠我心。<br>纵我不往，子宁不嗣音？<br>青青子佩，悠悠我思。<br>纵我不往，子宁不来？",
            "红豆生南国，春来发几枝。<br>愿君多采撷，此物最相思。",
            "玲珑骰子安红豆，<br>入骨相思知不知。<br>山有木兮木有枝，<br>心悦君兮君不知。",
            "月上柳梢头，人约黄昏后。<br>去年元夜时，花市灯如昼。",
            "人生若只如初见，<br>何事秋风悲画扇。<br>等闲变却故人心，<br>却道故人心易变。",
        ];

        const randomTextElement = document.getElementById("random-text");

        function renderRomanticText(text) {
            randomTextElement.innerHTML = "";
            let charIndex = 0;
            const textParts = text.split(/(<br>)/);

            textParts.forEach(part => {
                if (part === "<br>") {
                    const br = document.createElement("span");
                    br.className = "romantic-br";
                    randomTextElement.appendChild(br);
                    return;
                }

                for (const char of part) {
                    const charSpan = document.createElement("span");
                    charSpan.className = "romantic-char";
                    charSpan.textContent = char;
                    charSpan.style.animationDelay = `${charIndex * 0.08}s`;
                    randomTextElement.appendChild(charSpan);
                    charIndex++;
                }
            });
        }

        function showRandomMessage() {
            const randomIndex = Math.floor(Math.random() * messages.length);
            const randomMessage = messages[randomIndex];
            renderRomanticText(randomMessage);
        }

        showRandomMessage();
        setInterval(showRandomMessage, 10000);

    </script>
</body>

</html>
