<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>六（2）毕业纪念 - 登录</title>
    <style>
        body {
            background-image: url('https://bgithub.xyz/fanghuangxu/62/raw/refs/heads/main/icons/images/bg.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        header {
            text-align: center;
            padding: 2rem 0;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        header a {
            color: #fff;
            text-decoration: none;
            border-bottom: 1px dashed #fff;
            padding-bottom: 2px;
            transition: all 0.3s ease;
        }

        header a:hover {
            color: #f0f0f0;
            border-bottom: 1px solid #fff;
        }

        main {
            max-width: 400px;
            margin: 2rem auto;
            padding: 2.5rem;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
        }

        main h1 {
            text-align: center;
            color: #333;
            margin-top: 0;
            margin-bottom: 1.5rem;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        label {
            color: #555;
            font-weight: 500;
            margin-bottom: 0.3rem;
            display: block;
        }

        input[type="text"] {
            width: 100%;
            padding: 0.9rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #6b8eae;
            box-shadow: 0 0 0 3px rgba(107, 142, 174, 0.2);
        }

        button[type="submit"] {
            background-color: #4a6fa5;
            color: white;
            border: none;
            padding: 0.9rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button[type="submit"]:hover {
            background-color: #3a5a8c;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(58, 90, 140, 0.3);
        }

        button[type="submit"]:active {
            transform: translateY(0);
            box-shadow: 0 2px 6px rgba(58, 90, 140, 0.2);
        }
    </style>
    <script>
        async function hashString(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            return hashHex;
        }

        async function validateLogin() {
            var username = document.getElementById('name').value;
            var correctUsername = "688c6aa87034aa2dbffb6a00ddcb3e1342de0a12ca33320827dbf174e7604964";
            const usernameHash = await hashString(username);

            if (usernameHash === correctUsername) {
                window.location.href = 'lindex.html';
            } else {
                alert('用户名或密码错误，请重试。\nname:' + usernameHash);
            }
            return false;
        }
    </script>
</head>

<body>
    <header>
        <h1>六（2）毕业纪念 - 登录</h1>
        <a href="administrator_login.html">我是 administrator 组的成员</a>
    </header>
    <main>
        <h1>登录</h1>
        <form onsubmit="return validateLogin()">
            <label for="name">班主任的名字</label>
            <input type="text" id="name" name="name" required>
            <button type="submit" id="login-btn">登录</button>
        </form>
    </main>
</body>

</html>
