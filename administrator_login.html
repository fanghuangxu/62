<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>六（2）毕业纪念 - administrator 组成员 - 登录</title>
    <link rel="stylesheet" type="text/css" href="styles/main.page.css">
    <style>
        body {
            background-image: url('https://bgithub.xyz/fanghuangxu/62/raw/refs/heads/main/icons/images/bg.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
        }

        main {
            max-width: 420px;
            width: 90%;
            margin: 1rem auto 2rem;
            padding: 2.5rem;
            background-color: rgba(255, 255, 255, 0.93);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
        }

        main h1 {
            text-align: center;
            color: #2c3e50;
            margin-top: 0;
            margin-bottom: 1.8rem;
            font-weight: 600;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        label {
            color: #4a5568;
            font-weight: 500;
            margin-bottom: 0.4rem;
            display: block;
            font-size: 0.95rem;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 0.95rem 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-sizing: border-box;
            background-color: #fff;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #4299e1;
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.2);
        }

        button[type="submit"] {
            background-color: #3182ce;
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 0.5rem;
        }

        button[type="submit"]:hover {
            background-color: #2b6cb0;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(49, 130, 206, 0.3);
        }

        button[type="submit"]:active {
            transform: translateY(0);
            box-shadow: 0 2px 6px rgba(49, 130, 206, 0.2);
        }

        .password-group {
            position: relative;
        }

        .password-group input {
            padding-right: 2.5rem;
        }
    </style>
    <script>
        async function hashString(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            return hashHex;
        }

        async function validateLogin(event) {
            // 彻底阻止表单默认提交行为（关键修复）
            event.preventDefault();
            event.stopPropagation();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // 正确的用户名和密码哈希
            const correctUsername = 'f9f85eaff11b8cad76d449a2f744d82d14598d5a70f7ec4ac593f042fb8bb1b7';
            const correctPassword = '36a91dfc40f5e05e81adb02f619ec6c35ce6f2feaec0893988fbe9f02f97e056';
            const correctPassword2 = 'c787b8d8d05d8488cbfd5a3961e161cf7197853e9ec3b6885bbea83c9714b216';

            // 计算输入值的哈希
            const hashUsername = await hashString(username);
            const hashPassword = await hashString(password);

            // 验证成功则重定向到 lindex.html
            if ((hashUsername === correctUsername && hashPassword === correctPassword) ||
                (hashUsername === correctUsername && hashPassword === correctPassword2)) {
                // 清空表单避免数据残留
                document.getElementById('username').value = '';
                document.getElementById('password').value = '';
                // 强制重定向到 lindex.html
                window.location.assign('lindex.html');
                // 确保后续代码不执行
                return false;
            } else {
                alert('用户名或密码错误，请重试。');
                // 清空密码框
                document.getElementById('password').value = '';
            }

            return false;
        }
    </script>
</head>

<body>
    <h1>六（2）毕业纪念 - administrator 组成员 - 登录</h1>
    <a href="index.html">我不是 administrator 组的成员</a>
    <main>
        <h1>登录</h1>
        <!-- 传递事件对象用于阻止默认行为 -->
        <form onsubmit="return validateLogin(event)">
            <div>
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="password-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" id="login-btn">登录</button>
        </form>
    </main>
</body>

</html>
